[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "torneo"
version = "0.1.0"
description = "Breakthrough de combate: motor, árbitro y liga del torneo IA O26."
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

# Diseño plano: los módulos viven directo en sistema/ (config.py, motor/, ...).
# Se instala en modo editable (`pip install -e sistema`) para que config.py
# encuentre los .toml y la raíz del repo.
[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
where = ["."]
include = ["motor*", "arbitro*", "liga*", "validador*", "visor*", "cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
